########################################
# U-BOOT
########################################

# Repo + ref (branch / tag / commit)
UBOOT_REPO_URL="https://github.com/altera-opensource/u-boot-socfpga"
UBOOT_BRANCH="QPDS24.3.1_REL_GSRD_PR"

# Target / defconfig
UBOOT_DEFCONFIG="socfpga_agilex5_defconfig"
UBOOT_PLAT="agilex5"

# Build parallelism
UBOOT_JOBS=$(nproc)

########################################
# PATCH / CUSTOMIZATION CONTROL
########################################

# Apply your sed patches (1 = yes, 0 = skip)
UBOOT_APPLY_PATCHES=1

# Boot source selection (used by your sed)
UBOOT_BOOT_SOURCE="mmc"     # mmc / qspi / nand

# Disable NAND in DT (1 = yes)
UBOOT_DISABLE_NAND=1

########################################
# CONFIG FRAGMENT CONTROL
########################################

# Use custom config fragment (1 = yes)
UBOOT_USE_FRAGMENT=1

# Optional: path if you want to externalize fragment later
UBOOT_FRAGMENT_FILE=""   # leave empty to auto-generate

########################################
# ATF LINKAGE
########################################

# Path relative to TOP_FOLDER
UBOOT_BL31_PATH="../arm-trusted-firmware-sdcard/build/agilex5/release/bl31.bin"

########################################
# OPTIONAL
########################################
BITSTREAM_URL=""